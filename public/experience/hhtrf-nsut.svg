<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="64" fill="#160f24"/>
  <circle cx="40" cy="32" r="14" fill="#e879f9"/>
  <text x="68" y="40" fill="#ede9fe" font-size="22" font-weight="700">HHTRF · Leaf Composition — Regression</text>
  <rect x="1000" y="18" width="160" height="28" rx="14" fill="#2a1d45"/>
  <text x="1020" y="38" fill="#c4b5fd" font-size="15">Python · Jupyter</text>

  <!-- metric chips -->
  <rect x="40" y="96" width="260" height="96" rx="18" fill="#1b1330" stroke="#a78bfa" stroke-opacity="0.25"/>
  <text x="64" y="132" fill="#9c8bd0" font-size="15">R² Score</text>
  <text x="64" y="174" fill="#ede9fe" font-size="34" font-weight="700">0.94</text>
  <rect x="320" y="96" width="260" height="96" rx="18" fill="#1b1330" stroke="#e879f9" stroke-opacity="0.25"/>
  <text x="344" y="132" fill="#9c8bd0" font-size="15">MSE</text>
  <text x="344" y="174" fill="#ede9fe" font-size="34" font-weight="700">3.31</text>

  <!-- scatter + regression chart -->
  <rect x="40" y="216" width="700" height="500" rx="18" fill="#160f24"/>
  <text x="64" y="256" fill="#ede9fe" font-size="18" font-weight="600">Actual vs. Predicted</text>
  <line x1="100" y1="300" x2="100" y2="676" stroke="#3b2a5e" stroke-width="2"/>
  <line x1="100" y1="676" x2="700" y2="676" stroke="#3b2a5e" stroke-width="2"/>
  <line x1="100" y1="676" x2="700" y2="320" stroke="#a78bfa" stroke-width="3" stroke-dasharray="6 6"/>
  <g fill="#e879f9">
    <circle cx="150" cy="640" r="6"/><circle cx="210" cy="612" r="6"/><circle cx="265" cy="590" r="6"/>
    <circle cx="320" cy="556" r="6"/><circle cx="375" cy="540" r="6"/><circle cx="430" cy="500" r="6"/>
    <circle cx="490" cy="470" r="6"/><circle cx="545" cy="430" r="6"/><circle cx="600" cy="396" r="6"/>
    <circle cx="655" cy="356" r="6"/>
  </g>

  <!-- loss curve chart -->
  <rect x="760" y="216" width="416" height="500" rx="18" fill="#160f24"/>
  <text x="784" y="256" fill="#ede9fe" font-size="18" font-weight="600">Loss Curves</text>
  <line x1="800" y1="300" x2="800" y2="676" stroke="#3b2a5e" stroke-width="2"/>
  <line x1="800" y1="676" x2="1150" y2="676" stroke="#3b2a5e" stroke-width="2"/>
  <path d="M800 360 C 880 520, 980 600, 1150 632" stroke="#c4b5fd" stroke-width="3" fill="none"/>
  <path d="M800 400 C 880 560, 980 620, 1150 648" stroke="#e879f9" stroke-width="3" fill="none"/>
  <rect x="820" y="312" width="14" height="14" rx="3" fill="#c4b5fd"/>
  <text x="842" y="324" fill="#9c8bd0" font-size="14">train</text>
  <rect x="920" y="312" width="14" height="14" rx="3" fill="#e879f9"/>
  <text x="942" y="324" fill="#9c8bd0" font-size="14">val</text>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#120c20"/>
      <stop offset="1" stop-color="#0c0a14"/>
    </linearGradient>
